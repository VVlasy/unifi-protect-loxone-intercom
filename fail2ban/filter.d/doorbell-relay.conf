# fail2ban filter for the SDP-sanitizing SIP relay's security log
# (/var/log/asterisk/relay_security inside the container; reach it via the
# same bind mount as the Asterisk security log).
#
# In relay mode (SIP_EXTERNAL_ADDRESS set) Asterisk only ever sees 127.0.0.1
# as a source, so the stock asterisk filter goes blind to external scanners.
# The relay still knows every caller's real address and records each 4xx/5xx
# SIP response it forwards to an off-LAN peer, one line per event:
#
#   2026-07-25 18:00:00 SECURITY 404 to 91.134.23.125:63971

[Definition]
failregex = SECURITY [45]\d\d to <HOST>:\d+$
ignoreregex =
