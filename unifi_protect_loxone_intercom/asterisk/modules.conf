;==============================================================================
; modules.conf  -  autoload everything (Debian/Ubuntu package default).
; The bits this project relies on: res_pjsip*, chan_pjsip, res_ari*,
; res_stasis, app_stasis, res_rtp_asterisk and chan_rtp (UnicastRTP /
; ARI externalMedia). Autoload pulls them all in.
;==============================================================================
[modules]
autoload = yes
; Deprecated legacy SIP driver: never used here (everything is PJSIP), but it
; tries to bind 0.0.0.0:5060 by default. Pre-1.0.4 it silently lost that race
; to PJSIP; in relay mode (PJSIP on 127.0.0.1:5070) it stole :5060 from the
; SDP relay via SO_REUSEADDR and blackholed all calls in its empty 'public'
; context, while also answering scanners' REGISTERs. Keep it off.
noload => chan_sip.so
