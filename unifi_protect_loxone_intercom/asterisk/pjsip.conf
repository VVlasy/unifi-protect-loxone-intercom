;==============================================================================
; pjsip.conf
;
; Purpose: accept the ANONYMOUS SIP call the Loxone app makes (no registration,
; no password) and hand it to the [from-loxone] dialplan context.
;
; The Loxone app is NOT a full SIP client. It sends an unauthenticated INVITE
; straight to this Asterisk box. PJSIP routes any unidentified inbound request
; to the special endpoint literally named "anonymous" (if one exists), so that
; is what we define below.
;==============================================================================

[transport-udp]
type = transport
protocol = udp
; Rendered by entrypoint.sh: 0.0.0.0:5060 normally (LAN/VPN-only), or
; 127.0.0.1:5070 when SIP_EXTERNAL_ADDRESS is set and the SDP-sanitizing relay
; (sip_sdp_relay.py) owns :5060 in front of us. See ADVANCED.md > Remote access.
bind = __SIP_BIND__
; Optional settings (local_net) are rendered into this include from the
; SIP_LOCAL_NET env var at boot. Empty by default. Nothing here needs
; hand-editing; drive it from .env (or the addon options). See ADVANCED.md.
#include pjsip_transport_extra.conf

;------------------------------------------------------------------------------
; Anonymous inbound endpoint (this is the Loxone call)
;------------------------------------------------------------------------------
[anonymous]
type = endpoint
context = from-loxone
disallow = all
allow = ulaw,alaw            ; G.711 - exactly what the Loxone app offers
direct_media = no            ; force RTP through Asterisk (needed for the bridge)
rtp_symmetric = yes          ; learn the phone's real RTP source (NAT-safe)
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733          ; lets a Loxone "door open" button send DTMF later
; Stuck-call protection: hang up if no RTP arrives for this long. Catches a
; caller that vanished without a (deliverable) BYE - killed app, dead CGNAT
; mapping, network drop. Safe for quiet calls: SIP clients send continuous
; audio frames, this triggers on NO PACKETS, not no speech. The absolute
; per-call cap lives in extensions.conf (TIMEOUT(absolute), MAX_CALL_SECS).
rtp_timeout = 30
rtp_timeout_hold = 90
